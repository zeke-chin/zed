# fork 自有的三平台打包，不由 `cargo xtask workflows` 生成。
# 复用官方的 script/bundle-*，但跑在 GitHub 托管 runner 上（官方用的 Namespace / 自建 runner fork 用不了），
# 不带签名、公证和 Sentry 相关 secrets，脚本会自动走未签名 / 本地临时签名路径。
name: fork_bundle
on:
  workflow_dispatch:
    inputs:
      ref:
        # workflow_dispatch 只能选带有本文件的分支；没合入本文件的分支（如功能分支）通过这里指定。
        description: 要构建的分支、tag 或提交，留空则构建触发时选的分支
        type: string
        default: ''
      release:
        description: 构建完把产物发到 GitHub Release（tag 为 fork-<提交短哈希>）
        type: boolean
        default: true
  push:
    tags:
    - fork-v*
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  bundle_linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    name: bundle_linux_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      # 官方在 20.04 上从 PPA 装 clang-18；24.04 的默认 clang 就是 18。
      CC: clang-18
      CXX: clang++-18
      LLD: /usr/bin/ld.lld-18
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
    - name: free_disk_space
      # release 编译的 target 目录二十多 GB，托管 runner 默认剩余空间不够。
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
    - name: checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: set_commit_sha
      # 与 fork/bundle.sh 一致：「关于」里的提交号带 -fork 后缀，crates/zed/build.rs 原样传给 rustc-env。
      run: echo "ZED_COMMIT_SHA=$(git rev-parse HEAD)-fork" >> "$GITHUB_ENV"
    - name: setup_linux
      run: ./script/linux
    - name: download_wasi_sdk
      run: ./script/download-wasi-sdk
    - name: bundle_linux
      run: ./script/bundle-linux --skip-sentry
    - name: upload_bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-linux-${{ matrix.arch }}.tar.gz
        path: target/release/zed-linux-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
    - name: upload_remote_server
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-remote-server-linux-${{ matrix.arch }}.gz
        path: target/zed-remote-server-linux-${{ matrix.arch }}.gz
        if-no-files-found: error

  bundle_mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    name: bundle_mac_${{ matrix.arch }}
    # 免费的 arm64 macOS runner（macos-15、macos-26）经常排队 15 分钟拿不到机器被取消，
    # 改用 Intel runner，aarch64 交叉编译（官方是在 Apple Silicon 上交叉编译 x86_64）。
    runs-on: macos-15-intel
    timeout-minutes: 300
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
    - name: checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: set_commit_sha
      # 与 fork/bundle.sh 一致：「关于」里的提交号带 -fork 后缀，crates/zed/build.rs 原样传给 rustc-env。
      run: echo "ZED_COMMIT_SHA=$(git rev-parse HEAD)-fork" >> "$GITHUB_ENV"
    - name: setup_node
      # bundle-mac 会 npm install --global dmg-license。
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '24'
        package-manager-cache: false
    - name: select_xcode_26
      # bundle-mac 要求 macOS SDK 26+；macos-15 镜像默认是 Xcode 16，另装了几个 Xcode 26，取最新的。
      run: |
        xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
        test -n "$xcode"
        echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
    - name: print_macos_toolchain
      run: |
        sw_vers
        xcodebuild -version
        xcrun --sdk macosx --show-sdk-version
        df -h /
    - name: bundle_mac
      # 没有 MACOS_CERTIFICATE 等变量时 bundle-mac 用 codesign --sign - 做本地临时签名，不公证。
      run: ./script/bundle-mac ${{ matrix.arch }}-apple-darwin
    - name: upload_bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-${{ matrix.arch }}.dmg
        path: target/${{ matrix.arch }}-apple-darwin/release/Zed-${{ matrix.arch }}.dmg
        if-no-files-found: error
    - name: upload_remote_server
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-remote-server-macos-${{ matrix.arch }}.gz
        path: target/zed-remote-server-macos-${{ matrix.arch }}.gz
        if-no-files-found: error

  bundle_windows:
    strategy:
      fail-fast: false
      matrix:
        # 和官方一样，aarch64 在 x64 机器上交叉编译。
        arch: [x86_64, aarch64]
    name: bundle_windows_${{ matrix.arch }}
    # windows-2022 镜像自带 Inno Setup 6（bundle-windows.ps1 依赖它）；2025 镜像没有。
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
    defaults:
      run:
        shell: pwsh
    steps:
    - name: enable_long_paths
      run: git config --system core.longpaths true
    - name: checkout_repo
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: ${{ inputs.ref || github.sha }}
    - name: set_commit_sha
      # 与 fork/bundle.sh 一致：「关于」里的提交号带 -fork 后缀，crates/zed/build.rs 原样传给 rustc-env。
      run: |
        $ErrorActionPreference = "Stop"
        "ZED_COMMIT_SHA=$(git rev-parse HEAD)-fork" >> $env:GITHUB_ENV
    - name: shim_vs_dev_shell
      # bundle-windows.ps1 写死了 VS 2022 Community 的 Launch-VsDevShell.ps1，托管 runner 装的是 Enterprise；
      # 在 Community 路径放一个转发脚本，不改上游脚本。
      run: |
        $ErrorActionPreference = "Stop"
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installPath) { throw "vswhere 没找到装有 VC 工具链的 Visual Studio" }
        $real = Join-Path $installPath "Common7\Tools\Launch-VsDevShell.ps1"
        $shimDir = "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools"
        $shim = Join-Path $shimDir "Launch-VsDevShell.ps1"
        if (Test-Path $shim) {
          Write-Host "已存在 $shim，不需要转发"
          exit 0
        }
        New-Item -ItemType Directory -Path $shimDir -Force | Out-Null
        @"
        param([string]`$Arch, [string]`$HostArch)
        & "$real" -Arch `$Arch -HostArch `$HostArch -SkipAutomaticLocation
        "@ | Set-Content -Path $shim
        Get-Content $shim
    - name: set_release_version
      # CI 环境下 bundle-windows.ps1 要求 RELEASE_VERSION，官方由自建 runner 的环境提供。
      run: |
        $ErrorActionPreference = "Stop"
        $match = Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
        if (-not $match) { throw "读不到 crates/zed/Cargo.toml 的 version" }
        $version = $match.Matches[0].Groups[1].Value
        Write-Host "RELEASE_VERSION=$version"
        "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
    - name: bundle_windows
      # 没有 AZURE_* 签名变量时脚本跳过代码签名，产出未签名的安装包。
      run: script/bundle-windows.ps1 -Architecture ${{ matrix.arch }}
    - name: upload_bundle
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: Zed-${{ matrix.arch }}.exe
        path: target/Zed-${{ matrix.arch }}.exe
        if-no-files-found: error
    - name: upload_remote_server
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zed-remote-server-windows-${{ matrix.arch }}.zip
        path: target/zed-remote-server-windows-${{ matrix.arch }}.zip
        if-no-files-found: error

  publish_release:
    # 推送 fork-v* tag 时用该 tag 发布；手动触发且勾选 release 时按构建的提交发布到 fork-<短哈希>。
    if: startsWith(github.ref, 'refs/tags/fork-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [bundle_linux, bundle_mac, bundle_windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: download_artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        path: dist
        merge-multiple: true
    - name: publish_release
      env:
        GH_TOKEN: ${{ github.token }}
        IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/fork-v') }}
        BUILD_REF: ${{ inputs.ref || github.ref_name }}
        BUILD_SHA: ${{ inputs.ref || github.sha }}
      run: |
        set -euo pipefail
        ls -la dist
        sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$BUILD_SHA" --jq .sha)"
        short="${sha:0:10}"
        if [ "$IS_TAG_PUSH" = "true" ]; then
          tag="$GITHUB_REF_NAME"
          title="$GITHUB_REF_NAME"
        else
          tag="fork-$short"
          title="$BUILD_REF @ $short"
        fi
        notes="fork 构建：\`$BUILD_REF\` 的提交 $sha，构建记录 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID。
        未签名、未公证：macOS 首次打开需右键「打开」或执行 xattr -dr com.apple.quarantine \"/Applications/Zed Dev.app\"；Windows 会有 SmartScreen 提示。"
        # 同一提交重复构建（重跑、换分支名触发）时更新已有 Release 的产物，不报错。
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        else
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "$title" \
            --notes "$notes" \
            --prerelease
        fi
